version: '3.8'
services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: marketgrid_user
      POSTGRES_PASSWORD: marketgrid_password
      POSTGRES_DB: marketgrid_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
      image: redis/redis-stack:latest
      ports:
        - "6379:6379"
        - "8001:8001"
      volumes:
        - redis_data:/data

volumes:
  postgres_data:
  redis_data:
